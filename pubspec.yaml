name: fitcoach_ai
description: AI-powered fitness coaching app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Backend & Database
  supabase_flutter: ^2.0.0
  
  # UI & Design
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  
  # Navigation
  go_router: ^12.1.3
  
  # Utils
  http: ^1.1.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  permission_handler: ^11.1.0
  
  # Charts & Analytics
  fl_chart: ^0.66.0
  
  # Date & Time
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/workouts/
